<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>المسبحة</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="icon" href="praying.png" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:ital@0;1&family=Urbanist:ital,wght@0,600;1,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <style>
      /* Small page-specific adjustments that keep global style from style.css */
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .tasbih-wrapper {
        max-width: 600px;
        margin: 120px auto 40px; /* leave space for fixed nav */
        padding: 1rem;
      }

      #clickable-area {
        width: 100%;
        min-height: 180px;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: var(--card-bg, #f8f6f4);
        border: 2px solid rgba(0, 0, 0, 0.06);
        border-radius: 12px;
        cursor: pointer;
        transition: transform 0.12s ease, background-color 0.12s ease;
      }

      #clickable-area:active {
        transform: scale(0.997);
      }

      #phrase-display {
        font-size: 1.6rem;
        margin: 0;
        font-family: "Amiri", serif;
      }

      #count-display {
        font-size: 1.1rem;
        margin-top: 0.75rem;
        text-align: center;
      }

      .controls {
        display: flex;
        gap: 0.6rem;
        margin-top: 1rem;
      }

      @media (max-width: 576px) {
        #clickable-area {
          min-height: 140px;
        }

        #phrase-display {
          font-size: 1.3rem;
        }
      }
    </style>
  </head>

  <body>
    <div class="tasbih-wrapper container">
      <div class="card supplication-card p-3">
        <h1 class="section-title text-center mb-3">المسبحة</h1>

        <div id="clickable-area" role="button" tabindex="0">
          <h2 id="phrase-display">سبحان الله</h2>
        </div>

        <div id="count-display"><span id="count">0</span></div>

        <div class="controls mt-3">
          <a href="index.html" class="btn btn-outline-primary flex-fill"
            >الرجوع</a
          >
          <button id="reset-btn" class="btn btn-danger flex-fill">
            إعادة تعيين
          </button>
          <button id="done-btn" class="btn btn-success flex-fill">إنهاء</button>
        </div>
      </div>
    </div>

    <script>
      let count = 0;
      const phrases = ["سبحان الله", "الحمد لله", "الله أكبر"];
      const specialPhrase =
        "لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير";

      const clickableArea = document.getElementById("clickable-area");
      const resetBtn = document.getElementById("reset-btn");
      const countDisplay = document.getElementById("count");
      const phraseDisplay = document.getElementById("phrase-display");

      // Increment the count and display phrase on each click or key press (Enter/Space)
      function incrementCounter() {
        count++;
        countDisplay.textContent = count;

        if (count % 100 === 0) {
          phraseDisplay.textContent = specialPhrase;
        } else {
          phraseDisplay.textContent = phrases[(count - 1) % phrases.length];
        }
      }

      clickableArea.addEventListener("click", incrementCounter);
      clickableArea.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") incrementCounter();
      });

      // Reset the counter
      resetBtn.addEventListener("click", () => {
        count = 0;
        countDisplay.textContent = count;
        phraseDisplay.textContent = phrases[0];
      });

      // Done button - you can customize this action
      document.getElementById("done-btn").addEventListener("click", () => {
        alert(`تم إنهاء التسبيح بعد ${count} تسبيحة`);
      });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
