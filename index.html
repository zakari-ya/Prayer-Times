<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moroccan Prayer Times</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital@0;1&family=Urbanist:ital,wght@0,600;1,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>
<body class="d-flex align-items-center justify-content-center py-4">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <!-- Language Selector -->
                <div class="language-selector mb-4">
                    <select id="language" class="form-select shadow-sm">
                        <option value="en">English</option>
                        <option value="fr">Français</option>
                        <option value="ar">العربية</option>
                    </select>
                </div>

                <div class="card prayer-card border-0 rounded-4 p-3 p-md-4">
                    <div class="card-body">
                        <h1 class="card-title app-title text-center mb-4" id="app-title">
                            Moroccan Prayer Times
                        </h1>
                        
                        <!-- Current Date Display -->
                        <div class="mt-3 text-center">
                            <div class="badge bg-primary bg-opacity-75 text-white fs-6 p-2 rounded-pill" id="current-date">
                                Loading date...
                            </div>
                        </div>

                        <!-- City Selection -->
                        <div class="mb-4">
                            <label for="city" class="form-label fw-semibold" id="city-label">Select City:</label>
                            <select id="city" class="form-select form-select-lg shadow-sm">
                                <option value="Marrakech">Marrakech</option>
                                <option value="Casablanca">Casablanca</option>
                                <option value="Rabat">Rabat</option>
                                <option value="Salé">Salé</option>
                                <option value="Fès">Fès</option>
                                <option value="Tanger">Tanger</option>
                                <option value="Agadir">Agadir</option>
                                <option value="Meknès">Meknès</option>
                                <option value="Oujda">Oujda</option>
                                <option value="Tetouan">Tetouan</option>
                                <option value="Al Hoceima">Al Hoceima</option>
                                <option value="Ouarzazate">Ouarzazate</option>
                            </select>
                        </div>

                        <!-- Countdown Section -->
                        <div class="countdown-section rounded-3 p-3 mb-4 text-center">
                            <p class="countdown-label mb-1" id="countdown-label">Next Prayer in</p>
                            <p class="countdown-timer mb-0" id="countdown">--:--:--</p>
                            <p class="next-prayer-name mb-2" id="next-prayer-name">Loading...</p>
                        </div>

                        <!-- Prayer Times -->
                        <div class="prayer-times">
                            <div class="prayer-time d-flex justify-content-between align-items-center rounded-3 p-3 mb-3" id="fajr">
                                <span class="prayer-hour" id="fajr-time">--:--</span>
                                <span class="prayer-name" id="fajr-label">Fajr</span>
                            </div>
                            <div class="prayer-time d-flex justify-content-between align-items-center rounded-3 p-3 mb-3" id="dhuhr">
                                <span class="prayer-hour" id="dhuhr-time">--:--</span>
                                <span class="prayer-name" id="dhuhr-label">Dhuhr</span>
                            </div>
                            <div class="prayer-time d-flex justify-content-between align-items-center rounded-3 p-3 mb-3" id="asr">
                                <span class="prayer-hour" id="asr-time">--:--</span>
                                <span class="prayer-name" id="asr-label">Asr</span>
                            </div>
                            <div class="prayer-time d-flex justify-content-between align-items-center rounded-3 p-3 mb-3" id="maghrib">
                                <span class="prayer-hour" id="maghrib-time">--:--</span>
                                <span class="prayer-name" id="maghrib-label">Maghrib</span>
                            </div>
                            <div class="prayer-time d-flex justify-content-between align-items-center rounded-3 p-3" id="isha">
                                <span class="prayer-hour" id="isha-time">--:--</span>
                                <span class="prayer-name" id="isha-label">Isha</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
